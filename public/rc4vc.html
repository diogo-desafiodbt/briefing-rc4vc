<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistente de Briefing — Quora Performance</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0c10; --surface: #13161c; --surface2: #1c2028;
    --border: #2a2f3a; --accent: #c8a96e; --accent2: #e8c98a;
    --text: #eef0f4; --muted: #7a8194; --user-bg: #1e2535;
    --ai-bg: #161a22; --green: #4caf82; --radius: 16px;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { padding: 18px 28px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .logo-mark { width: 40px; height: 40px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'Syne', sans-serif; font-weight: 800; font-size: 13px; color: #0a0c10; flex-shrink: 0; }
  .header-info h1 { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 700; color: var(--text); }
  .header-info p { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .progress-bar-wrap { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  .progress-label { font-size: 11px; color: var(--muted); }
  .progress-track { width: 110px; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; transition: width 0.5s ease; width: 0%; }
  #chat { flex: 1; overflow-y: auto; padding: 24px 28px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  .bubble { max-width: 78%; padding: 14px 18px; border-radius: var(--radius); font-size: 14px; line-height: 1.65; animation: fadeUp 0.3s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .bubble.ai { background: var(--ai-bg); border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 4px; }
  .bubble.user { background: var(--user-bg); border: 1px solid #2e3a52; align-self: flex-end; border-bottom-right-radius: 4px; color: #c8d4f0; }
  .bubble.system { background: linear-gradient(135deg, #1a1f15, #1a2215); border: 1px solid #2a3a25; align-self: center; text-align: center; font-size: 13px; color: var(--green); max-width: 90%; padding: 12px 20px; }
  .bubble strong { color: var(--accent2); font-weight: 500; }
  .sender-label { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 6px; }
  .ai .sender-label { color: var(--accent); }
  .user .sender-label { color: #6a82b0; }
  .typing { display: flex; gap: 5px; align-items: center; padding: 6px 0; }
  .dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; animation: bounce 1.2s infinite ease-in-out; opacity: 0.7; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-7px); } }
  footer { padding: 16px 28px 20px; border-top: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
  .input-row { display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; resize: none; outline: none; min-height: 48px; max-height: 120px; line-height: 1.5; transition: border-color 0.2s; }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }
  button#sendBtn { width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity 0.2s, transform 0.1s; }
  button#sendBtn:hover { opacity: 0.9; transform: scale(1.03); }
  button#sendBtn:active { transform: scale(0.97); }
  button#sendBtn svg { width: 20px; height: 20px; fill: #0a0c10; }
  .briefing-box { background: var(--surface2); border: 1px solid var(--accent); border-radius: var(--radius); padding: 20px; font-size: 13px; line-height: 1.8; white-space: pre-wrap; color: var(--text); }
  .briefing-box h3 { font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; }
  .copy-btn { margin-top: 14px; background: var(--accent); color: #0a0c10; border: none; border-radius: 8px; padding: 9px 18px; font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; cursor: pointer; transition: opacity 0.2s; display: block; }
  .copy-btn:hover { opacity: 0.85; }
</style>
</head>
<body>
<header>
  <div class="logo-mark">QP</div>
  <div class="header-info">
    <h1>Assistente de Briefing — Quora Performance</h1>
    <p>Artes de Maio · RC4VC · Instagram</p>
  </div>
  <div class="progress-bar-wrap">
    <span class="progress-label" id="progressLabel">0 de 6 temas</span>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</header>
<div id="chat"></div>
<footer>
  <div class="input-row">
    <textarea id="userInput" placeholder="Digite sua resposta aqui..." rows="1"></textarea>
    <button id="sendBtn">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</footer>
<script>
const IS_TESTE = false;
const TEMAS = ["Novas Profissões","Atualizações do Sistema","Collab — Karina e Felipe (dados do mercado de processos e condenações)","Divulgação do Site","Novo Cotador e Comparativo","Marco Legal (X Tempo)"];
const SYSTEM_PROMPT = `Você é o Assistente de Briefing da Quora Performance, uma agência que produz artes para o Instagram do podcast RC4VC — um podcast voltado para corretores de seguros com foco em Seguro de Responsabilidade Civil.

Seu papel é entrevistar o cliente da RC4VC sobre as artes de Maio, tema por tema, e ao final gerar um briefing claro e estruturado para a designer executar.

TEMAS DE MAIO:
1. Novas Profissões
2. Atualizações do Sistema
3. Collab — Karina e Felipe (dados do mercado de processos e condenações)
4. Divulgação do Site
5. Novo Cotador e Comparativo
6. Marco Legal (X Tempo)

REGRAS:
- Seja profissional, direto e amigável
- Faça UMA pergunta por vez
- Para cada tema colete: (1) objetivo do post, (2) mensagem principal, (3) elementos visuais ou referências, (4) texto/chamada que deve aparecer na arte, (5) destaque especial
- Só avance quando tiver essas 5 informações. Diga "Perfeito! Vamos ao próximo tema." ao avançar
- Após os 6 temas, gere o briefing exatamente neste formato, sem texto extra:

BRIEFING DE ARTES — MAIO 2025
RC4VC × Quora Performance
Instagram
===
TEMA 1: Novas Profissões
• Objetivo: 
• Mensagem principal: 
• Tom visual: 
• Texto/chamada para a arte: 
• Destaques e observações: 

TEMA 2: Atualizações do Sistema
• Objetivo: 
• Mensagem principal: 
• Tom visual: 
• Texto/chamada para a arte: 
• Destaques e observações: 

TEMA 3: Collab — Karina e Felipe
• Objetivo: 
• Mensagem principal: 
• Tom visual: 
• Texto/chamada para a arte: 
• Destaques e observações: 

TEMA 4: Divulgação do Site
• Objetivo: 
• Mensagem principal: 
• Tom visual: 
• Texto/chamada para a arte: 
• Destaques e observações: 

TEMA 5: Novo Cotador e Comparativo
• Objetivo: 
• Mensagem principal: 
• Tom visual: 
• Texto/chamada para a arte: 
• Destaques e observações: 

TEMA 6: Marco Legal (X Tempo)
• Objetivo: 
• Mensagem principal: 
• Tom visual: 
• Texto/chamada para a arte: 
• Destaques e observações: 

===
ORIENTAÇÕES GERAIS PARA A DESIGNER:
[3 a 5 orientações sobre identidade visual, tom da marca RC4VC e cuidados para todos os posts]

Apresente-se em 2 linhas e inicie pelo Tema 1.`;

let history = [], temaAtual = 0, briefingGerado = false, isLoading = false;
const chat = document.getElementById('chat');
const input = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');

function updateProgress(n) {
  const s = Math.min(n, TEMAS.length);
  progressFill.style.width = (s / TEMAS.length * 100) + '%';
  progressLabel.textContent = s + ' de ' + TEMAS.length + ' temas';
}

function detectProgress(text) {
  if (text.toLowerCase().includes('próximo tema') || text.toLowerCase().includes('vamos ao tema')) {
    temaAtual = Math.min(temaAtual + 1, TEMAS.length);
    updateProgress(temaAtual);
  }
}

function addBubble(role, text) {
  const wrap = document.createElement('div');
  wrap.className = 'bubble ' + role;
  if (role !== 'system') {
    const label = document.createElement('div');
    label.className = 'sender-label';
    label.textContent = role === 'ai'? 'Assistente' : 'Você';
    wrap.appendChild(label);
  }
  const body = document.createElement('div');
  body.innerHTML = text.replace(/\*\(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
  wrap.appendChild(body);
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function addTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'bubble ai'; wrap.id = 'typing-ind';
  const label = document.createElement('div');
  label.className = 'sender-label'; label.textContent = 'Assistente';
  wrap.appendChild(label);
  const dots = document.createElement('div'); dots.className = 'typing';
  dots.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  wrap.appendChild(dots); chat.appendChild(wrap); chat.scrollTop = chat.scrollHeight;
}

function removeTyping() { const t = document.getElementById('typing-ind'); if (t) t.remove(); }

function showBriefing(text) {
  const wrap = document.createElement('div');
  wrap.className = 'bubble ai'; wrap.style.maxWidth = '95%';
  const label = document.createElement('div');
  label.className = 'sender-label'; label.textContent = 'Assistente';
  wrap.appendChild(label);
  const box = document.createElement('div'); box.className = 'briefing-box';
  const title = document.createElement('h3'); title.textContent = '📋 Briefing de Artes — Maio 2025';
  box.appendChild(title);
  const content = document.createElement('div'); content.textContent = text;
  box.appendChild(content);
  const btn = document.createElement('button'); btn.className = 'copy-btn'; btn.textContent = '📋 Copiar Briefing';
  btn.onclick = () => { navigator.clipboard.writeText(text).then(() => { btn.textContent = '✅ Copiado!'; setTimeout(() => btn.textContent = '📋 Copiar Briefing', 2500); }); };
  box.appendChild(btn); wrap.appendChild(box); chat.appendChild(wrap); chat.scrollTop = chat.scrollHeight;
}

async function callAPI(messages) {
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1000, system: SYSTEM_PROMPT, messages })
  });
  const data = await res.json();
  return data.content?.[0]?.text || '';
}

async function sendMessage(userText) {
  if (isLoading) return;
  isLoading = true; sendBtn.disabled = true;
  addBubble('user', userText);
  history.push({ role: 'user', content: userText });
  addTyping();
  try {
    const reply = await callAPI(history);
    removeTyping();
    history.push({ role: 'assistant', content: reply });
    detectProgress(reply);
    if (reply.includes('BRIEFING DE ARTES') && reply.includes('TEMA 1:') && !briefingGerado) {
      briefingGerado = true; temaAtual = TEMAS.length; updateProgress(TEMAS.length);
      showBriefing(reply);
      const sys = document.createElement('div'); sys.className = 'bubble system';
      sys.textContent = '✅ Briefing completo! Copie acima e envie para sua designer.';
      chat.appendChild(sys); chat.scrollTop = chat.scrollHeight;
    } else { addBubble('ai', reply); }
  } catch(e) { removeTyping(); addBubble('system', '❚』 Erro de conexão. Tente novamente.'); }
  isLoading = false; sendBtn.disabled = false; input.focus();
}

async function init() {
  updateProgress(0); addTyping();
  try {
    const initMsg = [{ role: 'user', content: 'Olá, estou pronto para responder sobre as artes de Maio.' }];
    const reply = await callAPI(initMsg);
    removeTyping();
    history.push(...initMsg); history.push({ role: 'assistant', content: reply });
    addBubble('ai', reply);
  } catch(e) {
    removeTyping();
    addBubble('ai', 'Olá! Sou o Assistente de Briefing da Quora Performance. Vamos definir as artes de Maio do RC4VC!\n\nVamos começar pelo **Tema 1: Novas Profissões**. Qual é o objetivo principal desse post?');
  }
}

sendBtn.addEventListener('click', () => {
  const text = input.value.trim(); if (!text || isLoading) return;
  input.value = ''; input.style.height = 'auto'; sendMessage(text);
});
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendBtn.click(); } });
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 120) + 'px'; });
init();
</script>
</body>
</html>
